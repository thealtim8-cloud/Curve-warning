<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curve Warning v3</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#e9e8e3;--fg:#1d2125;--card:#f7f6f2;--mut:#5d625f;--line:#c9c8c1;--ok:#17803f;--bad:#d3281c;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d2125;--fg:#f4f4ef;--card:#272c31;--mut:#9aa09c;--line:#3a4046;--ok:#3fd07f;--bad:#ff4a3b;--on:#1d2125}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;padding:12px}
main{max-width:480px;margin:0 auto;display:grid;gap:12px}
h1{font-size:18px;margin:0}
p{margin:0;color:var(--mut);font-size:13px;line-height:1.45}
.status{border-radius:14px;padding:14px;background:var(--ok);color:var(--on);text-align:center}
.status.bad{background:var(--bad)}
.status.idle{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.status b{display:block;font-size:30px;font-weight:800}
.status span{font-size:14px}
.row{display:flex;gap:10px}
.box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.box small{color:var(--mut);font-size:12px}
.num{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.num em{font-size:12px;font-style:normal;color:var(--mut);font-weight:600;margin-left:3px}
#map{height:340px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1 1 30%;font:inherit;font-size:14px;font-weight:700;padding:11px 6px;border-radius:10px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--fg)}
.car{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:26px solid #1a73e8;filter:drop-shadow(0 0 2px #fff)}
</style>
</head>
<body>
<main>
  <h1>Curve warning v3</h1>
  <div class="status idle" id="status" role="status" aria-live="polite"><b id="head">Not started</b><span id="sub">Tap Start GPS.</span></div>
  <div class="row">
    <div class="box"><small>Your speed</small><div class="num"><span id="spd">0</span><em class="u">km/h</em></div></div>
    <div class="box"><small>Safe for next curve</small><div class="num"><span id="safe">--</span><em class="u">km/h</em></div></div>
  </div>
  <div class="row">
    <div class="box"><small>Curve in</small><div class="num"><span id="dist">--</span><em>m</em></div></div>
    <div class="box"><small>Curve radius</small><div class="num"><span id="rad">--</span><em>m</em></div></div>
  </div>
  <div id="map" aria-label="Map"></div>
  <p>Blue arrow: you. Green line: road ahead. Red dot: sharpest curve.</p>
  <div class="btns">
    <button class="alt" id="zin">Zoom +</button>
    <button class="alt" id="zout">Zoom -</button>
    <button class="alt" id="orient">Heading up</button>
    <button class="alt" id="tilt">Tilt: flat</button>
    <button class="alt" id="follow">Follow: on</button>
    <button class="alt" id="unit">mph</button>
  </div>
  <div class="btns"><button id="gps">Start GPS</button></div>
  <p id="msg"></p>
  <p>Passenger testing only. Never look at the screen while driving. Map data: OpenStreetMap contributors.</p>
</main>
<script>
(function(){
  var LAT=2.5, LOOK=350, MAXR=300;
  var $=function(i){return document.getElementById(i)};
  var mph=false, ctx=null, lastBeep=0, ways=[], fetchedAt=null, busy=false, prev=null, hdg=null, speed=0;
  var route=[], curvePt=null, lastFix=null, lastCurve=null;
  var map=null, ready=false, carMk=null, follow=true, orient='head', pitch=0, zoomVal=17, camB=0;
  function f(){return mph?2.23694:3.6}
  function msg(t){$('msg').textContent=t}
  function toXY(p,o){return {x:(p.lon-o.lon)*111320*Math.cos(o.lat*Math.PI/180),y:(p.lat-o.lat)*110540}}
  function ll(p,o){return [o.lon+p.x/(111320*Math.cos(o.lat*Math.PI/180)),o.lat+p.y/110540]}
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
  function bearing(a,b){return (Math.atan2(b.x-a.x,b.y-a.y)*180/Math.PI+360)%360}
  function radius(a,b,c){
    var cr=Math.abs((b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x));
    return cr<1e-6?Infinity:dist(a,b)*dist(b,c)*dist(c,a)/(2*cr);
  }
  function beep(){
    try{var n=Date.now();if(n-lastBeep<1500||!ctx)return;lastBeep=n;
      var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=0.2;
      o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.18);}catch(e){}
  }

  /* ---------- curve analysis (same as before) ---------- */
  function analyze(pos,heading){
    var best=null;
    route=[];curvePt=null;
    ways.forEach(function(w){
      var pts=w.geometry.map(function(g){return toXY({lat:g.lat,lon:g.lon},pos)});
      pts.forEach(function(p,i){var d=Math.hypot(p.x,p.y);if(!best||d<best.d)best={d:d,pts:pts,i:i}});
    });
    if(!best||best.d>30||heading==null)return null;
    var pts=best.pts,i=best.i;
    var fwd=i<pts.length-1?bearing(pts[i],pts[i+1]):bearing(pts[i-1],pts[i]);
    var diff=Math.abs(((fwd-heading+540)%360)-180);
    var step=diff<90?1:-1, path=[{x:0,y:0}], cum=[0], acc=0, j=i;
    while(acc<LOOK){
      j+=step; if(j<0||j>=pts.length)break;
      var d=dist(path[path.length-1],pts[j]); if(d<8)continue;
      acc+=d; path.push(pts[j]); cum.push(acc);
    }
    var res=null;
    for(var k=1;k<path.length-1;k++){
      var r=radius(path[k-1],path[k],path[k+1]);
      if(r<MAXR&&(!res||r<res.r))res={r:r,d:cum[k],k:k};
    }
    route=path;curvePt=res?path[res.k]:null;
    return res;
  }
  async function loadWays(pos){
    busy=true;
    try{
      var q='[out:json][timeout:10];way(around:400,'+pos.lat+','+pos.lon+')[highway][highway!~"footway|path|steps|cycleway|service|track|pedestrian"];out geom;';
      var r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
      var j=await r.json();
      ways=j.elements.filter(function(e){return e.geometry});
      fetchedAt=pos; msg('Roads loaded: '+ways.length);
    }catch(e){msg('Road lookup failed. Check your internet connection.');}
    busy=false;
  }
  function show(curve){
    var u=mph?'mph':'km/h', cls='status', h, s;
    $('spd').textContent=Math.round(speed*f());
    var us=document.getElementsByClassName('u');for(var i=0;i<us.length;i++)us[i].textContent=u;
    if(!curve){
      $('safe').textContent='--';$('dist').textContent='--';$('rad').textContent='--';
      h='Road clear';s='No sharp curve in the next '+LOOK+' m.';
    }else{
      var safe=Math.sqrt(LAT*curve.r), over=speed>safe;
      $('safe').textContent=Math.round(safe*f());
      $('dist').textContent=Math.round(curve.d);
      $('rad').textContent=Math.round(curve.r);
      if(over){cls+=' bad';h='Slow down';s='Curve in '+Math.round(curve.d)+' m. Reduce by about '+Math.ceil((speed-safe)*f())+' '+u+'.';beep();}
      else{h='Curve ahead';s='Speed is OK for this curve.';}
    }
    $('status').className=cls;$('head').textContent=h;$('sub').textContent=s;
  }

  /* ---------- map ---------- */
  var EMPTY={type:'FeatureCollection',features:[]};
  function initMap(){
    if(!window.maplibregl){msg('Map library did not load. Check your internet connection.');return}
    map=new maplibregl.Map({
      container:'map',center:[0,20],zoom:2,
      style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'&copy; OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]}
    });
    var el=document.createElement('div');el.className='car';
    carMk=new maplibregl.Marker({element:el,rotationAlignment:'map',pitchAlignment:'map'}).setLngLat([0,20]).addTo(map);
    map.on('load',function(){
      map.addSource('route',{type:'geojson',data:EMPTY});
      map.addLayer({id:'route',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#17a84b','line-width':7,'line-opacity':0.9}});
      map.addSource('curve',{type:'geojson',data:EMPTY});
      map.addLayer({id:'curve',type:'circle',source:'curve',paint:{'circle-radius':9,'circle-color':'#d3281c','circle-stroke-color':'#ffffff','circle-stroke-width':2}});
      ready=true;
    });
    setFollow(true);
  }
  function setFollow(on){
    follow=on;$('follow').textContent='Follow: '+(on?'on':'off');
    if(!map)return;
    ['dragPan','touchZoomRotate','doubleClickZoom','scrollZoom'].forEach(function(h){if(on)map[h].disable();else map[h].enable();});
  }
  function setMapData(pos){
    if(!ready)return;
    map.getSource('route').setData(route.length>1?{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:route.map(function(q){return ll(q,pos)})}}:EMPTY);
    map.getSource('curve').setData(curvePt?{type:'Feature',properties:{},geometry:{type:'Point',coordinates:ll(curvePt,pos)}}:EMPTY);
  }
  /* runs 5 times a second: moves the car smoothly between GPS readings */
  function tick(){
    if(!map||!lastFix)return;
    var dt=Math.min((Date.now()-lastFix.t)/1000,2.5), h=(hdg==null?0:hdg)*Math.PI/180, d=speed*dt;
    var lat=lastFix.lat+d*Math.cos(h)/110540;
    var lon=lastFix.lon+d*Math.sin(h)/(111320*Math.cos(lastFix.lat*Math.PI/180));
    carMk.setLngLat([lon,lat]);carMk.setRotation(hdg==null?0:hdg);
    var target=(orient==='head'&&hdg!=null)?hdg:0;
    var diff=((target-camB+540)%360)-180; camB=(camB+diff*0.35+360)%360;
    if(follow)map.jumpTo({center:[lon,lat],bearing:camB,zoom:zoomVal,pitch:pitch,padding:{top:Math.round($('map').clientHeight*0.45)}});
  }

  /* ---------- GPS ---------- */
  function onPos(p){
    var pos={lat:p.coords.latitude,lon:p.coords.longitude};
    var raw=p.coords.speed;
    if(raw==null||isNaN(raw)){
      raw=0;
      if(lastFix){var dt=(Date.now()-lastFix.t)/1000,dd=dist(toXY(lastFix,pos),{x:0,y:0});if(dt>0)raw=dd/dt;}
    }
    speed=lastFix?speed+0.75*(raw-speed):raw;   // light smoothing, small delay
    if(raw<0.5&&speed<1)speed=0;
    if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&speed>1)hdg=p.coords.heading;
    else if(prev){var a=toXY(prev,pos);if(Math.hypot(a.x,a.y)>5){hdg=bearing(a,{x:0,y:0});prev=pos;}}
    if(!prev)prev=pos;
    lastFix={lat:pos.lat,lon:pos.lon,t:Date.now()};
    if(!busy&&(!fetchedAt||dist(toXY(fetchedAt,pos),{x:0,y:0})>150))loadWays(pos);
    lastCurve=analyze(pos,hdg);show(lastCurve);setMapData(pos);
  }

  /* ---------- buttons ---------- */
  $('gps').addEventListener('click',function(){
    try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
    if(!navigator.geolocation){msg('GPS is not available in this browser.');return}
    msg('Waiting for GPS signal...');
    navigator.geolocation.watchPosition(onPos,function(e){msg('GPS blocked: '+e.message)},{enableHighAccuracy:true,maximumAge:0,timeout:10000});
  });
  $('unit').addEventListener('click',function(){mph=!mph;this.textContent=mph?'km/h':'mph';show(lastCurve);});
  $('zin').addEventListener('click',function(){zoomVal=Math.min(19,zoomVal+1);if(!follow&&map)map.zoomTo(zoomVal);});
  $('zout').addEventListener('click',function(){zoomVal=Math.max(10,zoomVal-1);if(!follow&&map)map.zoomTo(zoomVal);});
  $('orient').addEventListener('click',function(){orient=orient==='head'?'north':'head';this.textContent=orient==='head'?'Heading up':'North up';});
  $('tilt').addEventListener('click',function(){pitch=pitch?0:55;this.textContent='Tilt: '+(pitch?'3D':'flat');if(!follow&&map)map.easeTo({pitch:pitch});});
  $('follow').addEventListener('click',function(){setFollow(!follow);});

  initMap();
  setInterval(tick,200);
})();
</script>
</body>
</html>
